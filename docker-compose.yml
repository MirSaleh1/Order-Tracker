version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ordertracker-postgres
    restart: always
    environment:
      POSTGRES_DB: ordertracker_db
      POSTGRES_USER: mirsaleh
      POSTGRES_PASSWORD: mirsaleh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ordertracker-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ordertracker_db
      SPRING_DATASOURCE_USERNAME: mirsaleh
      SPRING_DATASOURCE_PASSWORD: mirsaleh
    depends_on:
      - postgres

volumes:
  postgres_data:
